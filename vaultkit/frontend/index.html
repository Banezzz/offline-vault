<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; connect-src 'self'; img-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
<title>离线保险库</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/app.css">
</head>
<body data-mode="boot">
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="seal" aria-hidden="true">保</span>
      <h1>离线保险库</h1>
      <span class="brand-note">仅本机 · 不联网</span>
    </div>
    <div class="session">
      <label id="idle-control" class="idle-control" hidden>
        <span class="idle-label">自动锁定</span>
        <span id="idle" class="idle"></span>
        <span class="select-wrap">
          <select id="idle-select" aria-label="空闲多久后锁定">
            <option value="60">空闲 1 分钟</option>
            <option value="180">空闲 3 分钟</option>
            <option value="300">空闲 5 分钟</option>
            <option value="900">空闲 15 分钟</option>
          </select>
        </span>
      </label>
      <button id="lock-btn" class="btn" type="button" hidden>锁定</button>
    </div>
  </div>
</header>
<div class="app">
  <div id="conn" class="conn" hidden role="alert">
    <p id="conn-text">和本机服务失去联系。</p>
    <button id="conn-retry" type="button" class="btn">重试</button>
  </div>
  <div id="lockwarn" class="lockwarn" hidden role="alert">
    <p>马上就要锁定，未保存的修改会被擦掉。</p>
    <button id="poke" type="button" class="btn">我在，先别锁</button>
  </div>
  <main id="view"><p class="booting">正在连接本机服务…</p></main>
  <footer>
    <div id="foot-path" class="foot-meta"></div>
    <p>主密码无法找回。助记词请另外手抄一份。此工具不推导私钥，也不连接钱包或银行。</p>
  </footer>
</div>
<div id="toast" class="toast" hidden role="status"></div>
<div id="dialog" hidden></div>
<noscript><p class="noscript">需要启用 JavaScript。脚本只从本机页面加载，不会访问外网。</p></noscript>
<script src="/app.js"></script>
</body>
</html>
